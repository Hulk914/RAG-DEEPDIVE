[project]
name = "rag"
version = "0.1.0"
description = "A small Gemini and Pinecone demo comparing direct answers, explicit RAG, and LCEL RAG"
readme = "README.md"
authors = [
    { email = "ayushthakur2009@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain-core>=1.8.3",
    "langchain-google-genai>=4.5.1",
    "langchain-pinecone>=0.2.13",
    "langchain-text-splitters>=1.1.3",
    "pinecone>=7.3.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = ["black>=26.10.1", "isort>=9.0.2"]
